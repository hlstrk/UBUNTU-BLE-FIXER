[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-ble-fixer"
version = "1.0.0"
description = "Bluetooth audio codec selector for the Ubuntu system tray"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hlstrk" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ubuntu-ble-fixer = "ubuntu_ble_fixer.cli:main"

[project.urls]
Homepage = "https://github.com/hlstrk/UBUNTU-BLE-FIXER"
Issues = "https://github.com/hlstrk/UBUNTU-BLE-FIXER/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
